name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    env:
      # 测试用 hash 向量，避免 CI 下载 embedding 模型
      EMBED_BACKEND: hash
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: 安装依赖
        run: pip install -r backend/requirements.lock
      - name: 运行测试
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: 前端测试与构建（vitest + tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 单元测试
        working-directory: frontend
        run: npm test
      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t llm-agent:ci .
      - name: 验证魔搭部署镜像
        run: |
          frontend_container=$(docker create llm-agent:ci)
          docker cp "$frontend_container:/app/frontend/dist" frontend/dist
          docker rm "$frontend_container"
          python3 scripts/prepare_deploy.py output/modelscope --target modelscope
          docker build -t llm-agent:modelscope output/modelscope
