name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    env:
      # 测试用 hash 向量，避免 CI 下载 embedding 模型
      EMBED_BACKEND: hash
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 运行测试
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: 前端测试与构建（vitest + tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 单元测试
        working-directory: frontend
        run: npm test
      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build
