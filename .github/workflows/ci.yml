name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    env:
      # 测试用 hash 向量，避免 CI 下载 embedding 模型
      EMBED_BACKEND: hash
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: 安装依赖
        run: pip install -r backend/requirements.lock
      - name: 运行测试
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: 前端测试与构建（vitest + tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 单元测试
        working-directory: frontend
        run: npm test
      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t llm-agent:ci .
      - name: 验证魔搭部署镜像
        run: |
          frontend_container=$(docker create llm-agent:ci)
          docker cp "$frontend_container:/app/frontend/dist" frontend/dist
          docker rm "$frontend_container"
          python3 scripts/prepare_deploy.py output/modelscope --target modelscope
          docker build -t llm-agent:modelscope output/modelscope
      - name: 验证免费部署入口与个人 Key 闸门
        run: |
          smoke_container=$(docker run -d --rm -p 127.0.0.1:17860:7860 llm-agent:modelscope)
          trap 'result=$?; if [ "$result" -ne 0 ]; then docker logs "$smoke_container"; fi; docker stop "$smoke_container" >/dev/null; exit "$result"' EXIT
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:17860'
          for attempt in range(40):
              try:
                  with urllib.request.urlopen(base + '/api/health', timeout=2) as response:
                      assert json.load(response)['storage_ok'] is True
                  break
              except (urllib.error.URLError, ConnectionError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise RuntimeError('Container did not become ready')
          request = urllib.request.Request(base + '/api/chat', data=b'{"message":"test"}', headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 400
          else:
              raise AssertionError('Public deployment must require a personal API key')
          print('ModelScope container is ready and enforces personal API keys')
          PY
