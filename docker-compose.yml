services:
  app:
    build: .
    container_name: llm-agent
    restart: unless-stopped
    # 默认只绑定本机；内网共享时设置 BIND_ADDR=0.0.0.0，并配合防火墙/VPN
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend/knowledge:/app/backend/knowledge
      - ./backend/data:/app/backend/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
